# Khasar Chess - 9×9 Chess Variant
# GPL-3.0 License

[khasar:chess]
maxRank = 9
maxFile = 9

# Position 17 for Z (Kheshig) - using 'z' to avoid any Betza/predefined conflicts
pieceToCharTable = P....LAY.........Z...Kp....lay.........z...k

# Piece definitions
king = k

# Pawn type declaration (required for promotion)
pawnTypes = p

# Use predefined piece types from Orda Chess
kniroo = l                     # Lancer: knight move, rook capture (mNcR)
knibis = a                     # Archer: knight move, bishop capture (mNcB)
silver = y                     # Yurt: silver general (FfW)

# Custom pieces (Betza notation)
customPiece1 = p:fmWfcF        # Pawn: forward 1 move, forward diagonal capture
customPiece10 = z:mNcNWF       # Kheshig: move like Knight, capture like Knight or Mann (WF)

startFen = lzaykyazl/9/ppppppppp/9/9/9/PPPPPPPPP/9/LZAYKYAZL w - - 0 1

# Promotion rules
promotionRegionWhite = *9
promotionRegionBlack = *1
promotionPieceTypes = laz      # Promote to Lancer, Archer, or Kheshig

# Special rules
doubleStep = false
castling = false
enPassant = false

# Camp Mate: King reaches opponent's back rank (not in check) = win
flagPiece = k
flagRegionWhite = *9
flagRegionBlack = *1
flagPieceSafe = true

# Game ending rules
stalemateValue = loss
nFoldRule = 3
nFoldValue = draw
nMoveRule = 0
bareKingValue = loss
