# Khasar Chess - 9×9 Chess Variant
# GPL-3.0 License

[khasar]
maxRank = 9
maxFile = 9

pieceToCharTable = PHALY................Kphaly................k

# Piece definitions
king = k

# Disable standard chess pieces to prevent slot conflicts
knight = -
bishop = -
rook = -
queen = -

# Pawn type declaration (required for promotion)
pawnTypes = p

# customPiece numbers match pieceToCharTable positions (1=N, 2=B, 3=R, 4=Q)
customPiece1 = p:fmWfcF        # Pawn (Position 0)
customPiece2 = h:NC            # Kheshig/Wildebeest (Position 1 = Knight slot)
customPiece3 = a:mNcB          # Archer (Position 2 = Bishop slot)
customPiece4 = l:mNcR          # Lancer (Position 3 = Rook slot)
customPiece5 = y:FfW           # Yurt (Position 4 = Queen slot)

startFen = lhaykyahl/9/ppppppppp/9/9/9/PPPPPPPPP/9/LHAYKYAHL w - - 0 1

# Promotion rules
promotionRegionWhite = *9
promotionRegionBlack = *1
promotionPieceTypes = lah      # Promote to Lancer, Archer, or Wildebeest

# Special rules
doubleStep = false
castling = false
enPassant = false

# Camp Mate: King reaches opponent's back rank (not in check) = win
flagPiece = k
flagRegionWhite = *9
flagRegionBlack = *1
flagPieceSafe = true

# Game ending rules
stalemateValue = loss
nFoldRule = 3
nFoldValue = draw
nMoveRule = 0
bareKingValue = loss
