# Khasar Chess - 9×9 Chess Variant
# GPL-3.0 License

[khasar]
maxRank = 9
maxFile = 9

# Orda-style pieceToCharTable: keep NBRQ in positions 1-4, custom pieces after position 5
# Position 7: A (Archer), Position 8: W (Wildebeest), Position 20: L (Lancer), Position 6: Y (Yurt)
pieceToCharTable = PNBRQ.YAW...........LKpnbrq.yaw...........lk

# Piece definitions
king = k

# Pawn type declaration (required for promotion)
pawnTypes = p

# Use predefined piece types from Orda Chess (like khans variant)
kniroo = l                     # Lancer: knight move, rook capture (mNcR)
knibis = a                     # Archer: knight move, bishop capture (mNcB)
silver = y                     # Yurt: silver general (FfW)

# Kheshig uses 'w' instead of 'h' to avoid Orda's centaur conflict
customPiece1 = p:fmWfcF        # Pawn: forward 1 move, forward diagonal capture
customPiece2 = w:NC            # Wildebeest (Kheshig): knight + camel

startFen = lwaykyawl/9/ppppppppp/9/9/9/PPPPPPPPP/9/LWAYKYAWL w - - 0 1

# Promotion rules
promotionRegionWhite = *9
promotionRegionBlack = *1
promotionPieceTypes = law      # Promote to Lancer, Archer, or Wildebeest

# Special rules
doubleStep = false
castling = false
enPassant = false

# Camp Mate: King reaches opponent's back rank (not in check) = win
flagPiece = k
flagRegionWhite = *9
flagRegionBlack = *1
flagPieceSafe = true

# Game ending rules
stalemateValue = loss
nFoldRule = 3
nFoldValue = draw
nMoveRule = 0
bareKingValue = loss
